<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1C1917">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Panel">
<title>Panel salonu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Montserrat:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body style="background:var(--surface-2)">

<div class="app" id="login" hidden style="max-width:420px;padding-block:14vh 40px">
  <p class="eyebrow">Panel salonu</p>
  <h1 style="font-family:var(--serif);font-size:2.4rem;margin:6px 0 20px" id="login-brand">Salon</h1>
  <form class="panelcard" id="loginform" style="display:grid;gap:14px">
    <div class="field">
      <label for="password">Hasło</label>
      <input type="password" id="password" name="password" autocomplete="current-password">
      <p class="err" id="login-err" hidden></p>
    </div>
    <button class="btn btn-ink" type="submit" style="width:100%">Zaloguj</button>
    <p class="muted" style="font-size:.8rem;text-align:center;margin:0"><a href="/" style="color:var(--ink-3)">← wróć na stronę</a></p>
  </form>
</div>

<div id="panel" hidden>
  <div class="app">
    <div class="apphead">
      <div><p class="eyebrow">Panel salonu</p><h1 id="p-title">Do akceptacji</h1><p class="d" id="p-date"></p></div>
      <button class="btn btn-ghost btn-sm" type="button" id="logout">Wyloguj</button>
    </div>
    <div class="stats" id="p-stats"></div>
    <div id="p-body"><p class="muted" style="margin-top:20px">Wczytuję rezerwacje…</p></div>
  </div>
  <nav class="tabbar" aria-label="Panel">
    <div class="in">
      <button type="button" data-tab="pending"><svg class="i" viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>Do akceptacji<span class="badge" id="tb-badge" hidden></span></button>
      <button type="button" data-tab="schedule"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Grafik</button>
      <button type="button" data-tab="history"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>Historia</button>
    </div>
  </nav>
</div>

<dialog id="maildlg" aria-labelledby="mail-subj">
  <div class="dlg">
    <p class="eyebrow" style="margin-bottom:10px">E-mail wysłany do klienta</p>
    <div class="mhead"><span>Do: <b id="mail-to"></b></span><span>Temat: <b id="mail-subj"></b></span></div>
    <div class="body" id="mail-body"></div>
    <div class="foot"><button class="btn btn-ink btn-sm" type="button" id="mail-close">Zamknij</button></div>
  </div>
</dialog>
<div class="toast" id="toast" role="status"><span id="toast-t"></span><button type="button" id="toast-a" hidden></button></div>
<script src="/assets/panel.js"></script>
</body>
</html>
